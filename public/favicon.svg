<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#07132B" />
    </linearGradient>
  </defs>
  <!-- Background Navy Card -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <!-- Metallic Border -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="url(#silverGrad)" stroke-width="2" stroke-opacity="0.6" />
  <rect x="8" y="8" width="84" height="84" rx="15" fill="none" stroke="url(#silverGrad)" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.35" />
  <!-- PK Monogram -->
  <text x="50" y="64" fill="url(#silverGrad)" font-family="'Times New Roman', serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-1">PK</text>
  <!-- Sub-label -->
  <circle cx="50" cy="80" r="2.5" fill="#38BDF8" />
</svg>